# Blueprint do Render: sobe SOMENTE o relay do COOP ONLINE (pasta relay/). O site fica na Vercel.
# No Render: New -> Blueprint -> escolha o repositorio -> Apply. Depois copie a URL do servico
# (ex.: https://superfighters-relay.onrender.com) pra window.SF_RELAY_URL no index.html (trocando http por wss).
services:
  - type: web
    name: superfighters-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
