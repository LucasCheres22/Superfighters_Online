<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superfighters HTML5</title>
<style>
  :root{--bg:#000;--panel:#1b2028;--line:#38414f;--fg:#e6e9ee;--dim:#8d97a6;--acc:#ffff7e}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Consolas,monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;display:block;width:800px;height:600px;text-align:center}
  canvas{display:block;background:#000;cursor:none;image-rendering:pixelated}
  #c{position:absolute;left:0;top:0}
  #mc{position:absolute;left:0;top:0;cursor:default;image-rendering:pixelated;background:transparent}
  button{font:inherit;color:var(--fg);background:#262d38;border:2px solid var(--line);padding:10px 18px;cursor:pointer}
  button:hover,button:focus-visible{border-color:var(--acc);outline:none}
  button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:bold}
  .actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
  #coopui div{margin:8px 0}
  #coopui input{font:inherit;padding:8px;width:170px;text-transform:uppercase;letter-spacing:3px;text-align:center;background:#111;color:var(--fg);border:2px solid var(--line)}
  #coopui .actions{margin-top:14px}
  #overlay{display:none;position:absolute;inset:0;background:rgba(8,10,14,.82);align-items:center;justify-content:center;z-index:5}
  #overlay.on{display:flex}
  #ovbox{background:#000;border:2px solid var(--fg);padding:22px 28px;min-width:300px;max-width:90%;max-height:96%;overflow-y:auto;text-align:left}
  #ovtitle{margin:0 0 6px;color:var(--acc);font-size:22px;font-family:sfpixel,ui-monospace,Consolas,monospace;letter-spacing:2px}
  #ovextra{color:var(--dim);margin-bottom:10px}
  table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
  td,th{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line)} th{color:var(--dim);font-weight:normal}
  tr.you td{color:var(--acc)}
  table.compact{margin:4px 0 8px} table.compact td,table.compact th{padding:1px 6px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="720"></canvas>
  <canvas id="mc" width="800" height="600"></canvas>
  <div id="overlay"><div id="ovbox">
    <h3 id="ovtitle"></h3><div id="ovextra"></div>
    <div id="ovtable"></div>
    <div id="coopui" style="display:none"></div>
    <div class="actions" id="ovbtns"></div>
  </div></div>
</div>
<!-- ONLINE (versus ate 8 jogadores): URL do relay no Render. Sem ela o botao COOP ONLINE nao funciona. -->
<script>window.SF_RELAY_URL = "wss://risk-quadrant-magnetize.ngrok-free.dev";</script>
<script src="src/net.js"></script>
<script src="data/fonts.js"></script>
<script src="data/weapons.js"></script>
<script src="data/maps.js"></script>
<script src="data/maps_swf.js"></script>
<script src="data/item_spawns.js"></script>
<script src="data/sprites.js"></script>
<script src="data/placements.js"></script>
<script src="data/map_extras.js"></script>
<script src="data/map_anim.js"></script>
<script src="data/map_glass.js"></script>
<script src="data/anim_decor.js"></script>
<script src="data/menu_org.js"></script>
<script src="mods/load.js"></script>
<script src="src/game.js"></script>
<script src="src/menu.js"></script>
</body>
</html>
